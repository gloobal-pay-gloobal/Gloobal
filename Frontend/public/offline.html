<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gloobal ID — Offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #F6F5FC;
        color: #14122B;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(160deg, #7C3AED 0%, #5B21B6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 28px;
        margin-bottom: 20px;
        box-shadow: 0 12px 28px rgba(124, 58, 237, 0.28);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #8B899E;
        margin: 0 0 22px;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: #fff;
        background: linear-gradient(160deg, #7C3AED 0%, #5B21B6 100%);
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.32);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">G</div>
      <h1>You're offline</h1>
      <p>Gloobal ID can't reach the network right now. Check your connection and try again — anything you'd already opened is still available offline.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
